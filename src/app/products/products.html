<div class="container mt-4">
  <h2 class="text-center mb-4 text-brown">Infinix Phone Catalog</h2>

  <div class="row">
    <div class="col-md-4 mb-4" *ngFor="let p of products">
      <div class="card shadow product-card h-100">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title text-brown">{{ p.name }}</h5>
          <p class="card-text"><strong>Price:</strong> ₱{{ p.price }}</p>
          <p class="card-text"><strong>Location:</strong> {{ p.location }}</p>

          <div class="mt-auto">
            <a [routerLink]="['/details', p.id]" class="btn btn-brown w-100"> View Details </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
